<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F172A" />
  <title>FinOS — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0F172A;
      color: #E2E8F0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin: 0 auto 2rem;
      overflow: hidden;
    }
    .icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94A3B8;
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    button {
      background: #22C55E;
      color: #0F172A;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><img src="/iconeAPP.png" alt="FinOS" /></div>
    <img src="/PrincipalLogo.png" alt="FinOS" style="height:36px;margin:0 auto 1.5rem;display:block;" />
    <p>
      FinOS nécessite une connexion Internet pour fonctionner correctement.
      Vérifiez votre connexion et réessayez.
    </p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
