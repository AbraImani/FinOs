<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="swooshGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="swooshGrey" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <!-- Wallet body tilted -->
  <g transform="translate(32,28) rotate(-12)">
    <rect x="-14" y="-10" width="28" height="20" rx="3" fill="#1E293B"/>
    <rect x="-14" y="-10" width="28" height="6" rx="3" fill="#0F172A"/>
    <!-- Card lines -->
    <rect x="-10" y="-1" width="12" height="1.5" rx="0.75" fill="#334155"/>
    <rect x="-10" y="3" width="8" height="1.5" rx="0.75" fill="#334155"/>
    <!-- Wallet flap -->
    <rect x="8" y="-2" width="7" height="8" rx="2" fill="#0F172A"/>
    <circle cx="12" cy="2" r="1.5" fill="#334155"/>
  </g>
  <!-- Green pixels top-left of wallet -->
  <rect x="14" y="11" width="3" height="3" rx="0.5" fill="#22C55E"/>
  <rect x="18" y="11" width="3" height="3" rx="0.5" fill="#22C55E"/>
  <rect x="14" y="15" width="3" height="3" rx="0.5" fill="#22C55E" opacity="0.6"/>
  <rect x="18" y="15" width="3" height="3" rx="0.5" fill="#22C55E" opacity="0.4"/>
  <!-- Swoosh orbit - grey top -->
  <ellipse cx="32" cy="32" rx="26" ry="12" fill="none" stroke="url(#swooshGrey)" stroke-width="3" stroke-linecap="round" stroke-dasharray="42 40" transform="rotate(-15,32,32)"/>
  <!-- Swoosh orbit - green bottom -->
  <ellipse cx="32" cy="32" rx="26" ry="12" fill="none" stroke="url(#swooshGreen)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="40 42" stroke-dashoffset="-42" transform="rotate(-15,32,32)"/>
</svg>
