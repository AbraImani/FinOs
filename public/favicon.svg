<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A34A"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- Dollar/Finance circle -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#0F172A" stroke-width="2.5" opacity="0.3"/>
  <!-- F letter -->
  <text x="50%" y="52%" text-anchor="middle" dy=".35em" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" fill="#0F172A">F</text>
  <!-- Small bar accent bottom-right -->
  <rect x="40" y="48" width="10" height="3" rx="1.5" fill="#0F172A" opacity="0.4"/>
</svg>
